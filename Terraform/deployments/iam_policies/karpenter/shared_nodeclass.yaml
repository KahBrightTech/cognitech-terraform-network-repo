apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: "[[account_name]]-[[region_prefix]]-shared"
spec:
  amiFamily: AL2023
  amiSelectorTerms:
  - alias: al2023@v20260724
  role: "[[node_role_name]]"
  subnetSelectorTerms:
  - tags:
      Name: "[[account_name]]-[[region_prefix]]-[[environment_abr]]-sbnt*-public-*"
  securityGroupSelectorTerms:
  - tags:
      Name: "[[account_name]]-[[region_prefix]]-[[environment_abr]]-*eks-nodes*"
  blockDeviceMappings:
  - deviceName: /dev/xvda
    ebs:
      volumeSize: 50Gi
      volumeType: gp3
      encrypted: true
      deleteOnTermination: true
  tags:
    ManagedBy: karpenter
    ClusterName: "[[cluster_name]]"
